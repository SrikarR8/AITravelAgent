[project]
name = "travelagentwebsite"
version = "0.1.0"
description = "Autonomous AI Travel Agent with LangGraph and React"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-postgres>=0.0.12",
    "langchain-huggingface>=0.1.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "datasets>=3.0.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "openmeteo-requests>=1.3.0",
    "requests-cache>=1.2.0",
    "retry-requests>=2.0.0",
    "pydantic>=2.7.0",
]
